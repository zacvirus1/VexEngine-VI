name: Update development clock

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-clock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate clock SVG
        run: node .github/scripts/update-clock.js

      - name: Commit SVG when changed
        run: |
          if git diff --quiet -- docs/clock.svg; then
            echo "docs/clock.svg is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/clock.svg
          git commit -m "chore: update development clock"
          git push
