<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VexEngine-VI · Relógio ao Vivo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #040b0e;
      padding: 20px;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }
    .vex-card {
      width: 100%;
      max-width: 540px;
      background: linear-gradient(145deg, #06231f, #07342e);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 18px;
      padding: 18px 20px;
      color: #eaf6f2;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }
    .vex-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c7e5dc;
    }
    .vex-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .vex-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 0 3px rgba(254, 243, 199, 0.25);
    }
    .vex-live {
      font-size: 0.7rem;
      color: #34d399;
      letter-spacing: 0.06em;
    }
    .vex-box {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
      align-items: center;
      background: rgba(3, 13, 18, 0.58);
      border: 1px solid rgba(146, 185, 173, 0.14);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
    }
    .vex-num {
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.75rem, 4.8vw, 2.4rem);
      font-weight: 700;
      line-height: 1.05;
      color: #f4fbf8;
    }
    .vex-lbl {
      margin-top: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #8fb8ac;
    }
    .vex-colon {
      font-size: 1.5rem;
      font-weight: 600;
      color: rgba(146, 185, 173, 0.45);
      transform: translateY(-7px);
      user-select: none;
    }
    .vex-foot {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(146, 185, 173, 0.14);
      font-size: 0.78rem;
      line-height: 1.45;
      color: #b6d5cb;
    }
    .vex-foot strong {
      display: block;
      color: #f1faf7;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .vex-foot small {
      display: block;
      margin-top: 4px;
      font-size: 0.72rem;
      color: #7fa89b;
    }
  </style>
</head>
<body>
  <aside class="vex-card" aria-live="polite" aria-label="VexEngine-VI Tempo em Desenvolvimento">
    <div class="vex-top">
      <div class="vex-left">
        <span class="vex-dot" aria-hidden="true"></span>
        <span>VexEngine-VI · Desenvolvimento</span>
      </div>
      <span class="vex-live">AO VIVO</span>
    </div>

    <div class="vex-box">
      <div>
        <div class="vex-num" id="d">00</div>
        <div class="vex-lbl">DIAS</div>
      </div>
      <div class="vex-colon" aria-hidden="true">:</div>
      <div>
        <div class="vex-num" id="h">00</div>
        <div class="vex-lbl">HORAS</div>
      </div>
      <div class="vex-colon" aria-hidden="true">:</div>
      <div>
        <div class="vex-num" id="m">00</div>
        <div class="vex-lbl">MIN</div>
      </div>
      <div class="vex-colon" aria-hidden="true">:</div>
      <div>
        <div class="vex-num" id="s">00</div>
        <div class="vex-lbl">SEG</div>
      </div>
    </div>

    <div class="vex-foot">
      <strong>Resultados já vinham sendo obtidos antes do vazamento do .exe.</strong>
      <span>Cena inicial informada: 2–5 FPS · ~14% de VRAM · ~16 GB de RAM</span>
      <small>Marco inicial: 23 nov. 2026, 11:36 BRT (UTC−03:00)</small>
    </div>
  </aside>

  <script>
    (function () {
      const start = new Date("2026-11-23T11:36:00-03:00").getTime();
      const dEl = document.getElementById("d");
      const hEl = document.getElementById("h");
      const mEl = document.getElementById("m");
      const sEl = document.getElementById("s");

      const pad = (n) => String(Math.max(0, Math.floor(n))).padStart(2, "0");

      function update() {
        const totalSec = Math.max(0, Math.floor((Date.now() - start) / 1000));
        dEl.textContent = pad(totalSec / 86400);
        hEl.textContent = pad((totalSec % 86400) / 3600);
        mEl.textContent = pad((totalSec % 3600) / 60);
        sEl.textContent = pad(totalSec % 60);
      }

      update();
      setInterval(update, 1000);
    })();
  </script>
</body>
</html>
