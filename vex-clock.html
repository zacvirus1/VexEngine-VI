<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VexEngine-VI · Tempo em Desenvolvimento</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #040b0e;
      padding: 20px;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }

    .vex-clock-wrap {
      width: 100%;
      max-width: 520px;
    }

    .vex-clock-card {
      background: linear-gradient(145deg, rgba(6, 35, 31, 0.92), rgba(7, 52, 46, 0.88));
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-radius: 18px;
      padding: 18px 20px 16px;
      color: #e6f3ef;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .vex-clock-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .vex-clock-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #bfe3d8;
    }

    .vex-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55);
      animation: pulseSubtle 2.4s infinite;
      flex-shrink: 0;
    }

    @keyframes pulseSubtle {
      0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.45); }
      70% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    .vex-clock-tag {
      font-size: 0.72rem;
      color: #88b8aa;
      white-space: nowrap;
    }

    .vex-timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr) auto repeat(0);
      grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 4px;
      background: rgba(3, 13, 18, 0.55);
      border: 1px solid rgba(146, 185, 173, 0.14);
      border-radius: 14px;
      padding: 12px 10px;
    }

    .vex-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .vex-num {
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.65rem, 4.5vw, 2.25rem);
      font-weight: 700;
      line-height: 1.05;
      color: #f4fbf8;
      letter-spacing: -0.02em;
    }

    .vex-lbl {
      margin-top: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #96bdb2;
    }

    .vex-sep {
      font-size: 1.45rem;
      font-weight: 600;
      color: rgba(146, 185, 173, 0.45);
      transform: translateY(-7px);
      user-select: none;
    }

    .vex-notes {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(146, 185, 173, 0.14);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .vex-lead {
      margin: 0;
      font-size: 0.84rem;
      font-weight: 600;
      color: #eaf6f2;
    }

    .vex-metrics {
      margin: 0;
      font-size: 0.78rem;
      color: #b7d6cc;
    }

    .vex-origin {
      margin: 2px 0 0;
      font-size: 0.72rem;
      color: #84ae9f;
    }
  </style>
</head>
<body>
  <main class="vex-clock-wrap">
    <aside
      class="vex-clock-card"
      id="vex-live-clock"
      aria-live="polite"
      aria-label="VexEngine-VI Tempo em Desenvolvimento"
    >
      <div class="vex-clock-top">
        <div class="vex-clock-title">
          <span class="vex-dot" aria-hidden="true"></span>
          <span>VexEngine-VI · Desenvolvimento</span>
        </div>
        <span class="vex-clock-tag">Ao vivo</span>
      </div>

      <div class="vex-timer-grid">
        <div class="vex-unit">
          <span class="vex-num" id="vc-days">00</span>
          <span class="vex-lbl">Dias</span>
        </div>
        <span class="vex-sep" aria-hidden="true">:</span>
        <div class="vex-unit">
          <span class="vex-num" id="vc-hours">00</span>
          <span class="vex-lbl">Horas</span>
        </div>
        <span class="vex-sep" aria-hidden="true">:</span>
        <div class="vex-unit">
          <span class="vex-num" id="vc-mins">00</span>
          <span class="vex-lbl">Min</span>
        </div>
        <span class="vex-sep" aria-hidden="true">:</span>
        <div class="vex-unit">
          <span class="vex-num" id="vc-secs">00</span>
          <span class="vex-lbl">Seg</span>
        </div>
      </div>

      <div class="vex-notes">
        <p class="vex-lead">Resultados já vinham sendo obtidos antes do vazamento do .exe.</p>
        <p class="vex-metrics">Cena inicial: 2–5 FPS · ~14% de VRAM · ~16 GB de RAM</p>
        <p class="vex-origin">Marco inicial: 23 nov. 2026, 11:36 BRT (UTC−03:00)</p>
      </div>
    </aside>
  </main>

  <script>
    (function () {
      const startMs = new Date("2026-11-23T11:36:00-03:00").getTime();

      const elDays = document.getElementById("vc-days");
      const elHours = document.getElementById("vc-hours");
      const elMins = document.getElementById("vc-mins");
      const elSecs = document.getElementById("vc-secs");

      function pad(value) {
        return String(Math.max(0, Math.floor(value))).padStart(2, "0");
      }

      function renderElapsed() {
        const diffSec = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
        const days = Math.floor(diffSec / 86400);
        const hours = Math.floor((diffSec % 86400) / 3600);
        const mins = Math.floor((diffSec % 3600) / 60);
        const secs = diffSec % 60;

        if (elDays) elDays.textContent = pad(days);
        if (elHours) elHours.textContent = pad(hours);
        if (elMins) elMins.textContent = pad(mins);
        if (elSecs) elSecs.textContent = pad(secs);
      }

      renderElapsed();
      setInterval(renderElapsed, 1000);
    })();
  </script>
</body>
</html>
